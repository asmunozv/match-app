services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: matchapp
      DB_USER: matchuser
      DB_PASS: matchpass
    depends_on:
      - db
    volumes:
      - ./public:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: matchapp
      MYSQL_USER: matchuser
      MYSQL_PASSWORD: matchpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data:
